<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sentinel - Open World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game { 
            border: 4px solid #444;
            box-shadow: 0 0 40px rgba(255,215,0,0.3);
            image-rendering: pixelated;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #title {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 10px #FFD700;
        }
        #stats {
            display: flex;
            gap: 20px;
            font-size: 18px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="title">NOVA SENTINEL</div>
        <div id="stats">
            <span id="time">⏰ 2:00 PM</span>
            <span>💰 $500</span>
            <span>⚡ 100</span>
            <span>😊 100</span>
        </div>
    </div>
    
    <canvas id="game" width="1000" height="700"></canvas>
    
    <div id="controls">
        WASD or Arrow Keys to Move • E to Enter Buildings
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameTime = { hours: 14, minutes: 0, day: 1 };
        let player = { 
            x: 500, 
            y: 350,
            speed: 4,
            walking: false,
            direction: 'down',
            frame: 0
        };
        
        let keys = {};
        let frameCount = 0;
        
        // Buildings
        const buildings = [
            { x: 100, y: 80, w: 160, h: 140, color: '#8B4513', name: 'Your Apartment', type: 'home' },
            { x: 350, y: 90, w: 140, h: 120, color: '#9370DB', name: 'Hero Shop', type: 'shop' },
            { x: 580, y: 85, w: 150, h: 130, color: '#FFD700', name: "McDonald's", type: 'mcdonalds' },
            { x: 120, y: 450, w: 130, h: 110, color: '#4682B4', name: 'Office', type: 'office' },
            { x: 400, y: 460, w: 120, h: 100, color: '#DC143C', name: 'Gym', type: 'gym' },
            { x: 650, y: 470, w: 135, h: 115, color: '#32CD32', name: 'Park', type: 'park' }
        ];
        
        // Trees
        const trees = [
            { x: 300, y: 320 }, { x: 450, y: 330 }, { x: 600, y: 315 },
            { x: 180, y: 600 }, { x: 350, y: 620 }, { x: 550, y: 610 },
            { x: 850, y: 150 }, { x: 880, y: 350 }, { x: 900, y: 550 }
        ];
        
        // Event listeners
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        // Game clock (1 real second = 1 game minute)
        setInterval(() => {
            gameTime.minutes++;
            if (gameTime.minutes >= 60) {
                gameTime.minutes = 0;
                gameTime.hours++;
            }
            if (gameTime.hours >= 24) {
                gameTime.hours = 0;
                gameTime.day++;
            }
            updateHUD();
        }, 1000);
        
        function updateHUD() {
            const h = gameTime.hours % 12 || 12;
            const m = gameTime.minutes.toString().padStart(2, '0');
            const period = gameTime.hours >= 12 ? 'PM' : 'AM';
            document.getElementById('time').textContent = `⏰ ${h}:${m} ${period} - Day ${gameTime.day}`;
        }
        
        function gameLoop() {
            frameCount++;
            
            // Player movement
            let moving = false;
            let newX = player.x;
            let newY = player.y;
            
            if (keys['w'] || keys['arrowup']) {
                newY -= player.speed;
                player.direction = 'up';
                moving = true;
            }
            if (keys['s'] || keys['arrowdown']) {
                newY += player.speed;
                player.direction = 'down';
                moving = true;
            }
            if (keys['a'] || keys['arrowleft']) {
                newX -= player.speed;
                player.direction = 'left';
                moving = true;
            }
            if (keys['d'] || keys['arrowright']) {
                newX += player.speed;
                player.direction = 'right';
                moving = true;
            }
            
            // Boundaries
            newX = Math.max(30, Math.min(970, newX));
            newY = Math.max(30, Math.min(670, newY));
            
            // Building collision
            let collision = false;
            buildings.forEach(b => {
                if (newX > b.x - 25 && newX < b.x + b.w + 25 &&
                    newY > b.y - 25 && newY < b.y + b.h + 25) {
                    collision = true;
                }
            });
            
            if (!collision) {
                player.x = newX;
                player.y = newY;
            }
            
            player.walking = moving;
            if (moving && frameCount % 10 === 0) {
                player.frame = (player.frame + 1) % 2;
            }
            
            // Render
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        function render() {
            const isDaytime = gameTime.hours >= 6 && gameTime.hours < 20;
            const isEvening = gameTime.hours >= 18 && gameTime.hours < 20;
            const isMorning = gameTime.hours >= 6 && gameTime.hours < 8;
            const isNight = !isDaytime;
            
            // Sky
            let skyColor = '#87CEEB';
            if (isNight) skyColor = '#1a1a2e';
            else if (isEvening) skyColor = '#FF6B35';
            else if (isMorning) skyColor = '#FFB347';
            
            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, 1000, 700);
            
            // Ground
            ctx.fillStyle = '#2F4F2F';
            ctx.fillRect(0, 0, 1000, 700);
            
            // Roads
            ctx.fillStyle = '#2C2C2C';
            ctx.fillRect(0, 280, 1000, 100);
            ctx.fillRect(270, 0, 100, 700);
            
            // Road markings
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 20]);
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.lineTo(1000, 330);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(320, 0);
            ctx.lineTo(320, 700);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Sidewalks
            ctx.fillStyle = '#696969';
            ctx.fillRect(0, 270, 1000, 10);
            ctx.fillRect(0, 380, 1000, 10);
            ctx.fillRect(260, 0, 10, 700);
            ctx.fillRect(370, 0, 10, 700);
            
            // Trees
            trees.forEach(tree => {
                // Trunk
                ctx.fillStyle = '#654321';
                ctx.fillRect(tree.x - 6, tree.y - 12, 12, 25);
                // Leaves
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.arc(tree.x, tree.y - 22, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(tree.x - 15, tree.y - 18, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(tree.x + 15, tree.y - 18, 18, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Buildings
            buildings.forEach(b => {
                // Main building
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
                
                // Roof
                ctx.fillStyle = '#654321';
                ctx.beginPath();
                ctx.moveTo(b.x - 12, b.y);
                ctx.lineTo(b.x + b.w/2, b.y - 25);
                ctx.lineTo(b.x + b.w + 12, b.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Door
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(b.x + b.w/2 - 18, b.y + b.h - 40, 36, 40);
                ctx.strokeRect(b.x + b.w/2 - 18, b.y + b.h - 40, 36, 40);
                
                // Windows
                ctx.fillStyle = isNight ? '#FFD700' : '#87CEEB';
                for (let i = 0; i < 2; i++) {
                    for (let j = 0; j < 2; j++) {
                        const wx = b.x + 25 + i * 60;
                        const wy = b.y + 25 + j * 40;
                        ctx.fillRect(wx, wy, 35, 28);
                        ctx.strokeRect(wx, wy, 35, 28);
                        ctx.beginPath();
                        ctx.moveTo(wx + 17, wy);
                        ctx.lineTo(wx + 17, wy + 28);
                        ctx.moveTo(wx, wy + 14);
                        ctx.lineTo(wx + 35, wy + 14);
                        ctx.stroke();
                    }
                }
                
                // Label if nearby
                const dist = Math.sqrt(Math.pow(player.x - (b.x + b.w/2), 2) + Math.pow(player.y - (b.y + b.h/2), 2));
                if (dist < 100) {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(b.x, b.y - 40, b.w, 35);
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 16px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(b.name, b.x + b.w/2, b.y - 22);
                    ctx.font = '13px monospace';
                    ctx.fillText('[E] Enter', b.x + b.w/2, b.y - 7);
                }
            });
            
            // Player
            drawPlayer(player.x, player.y, player.direction, player.frame);
        }
        
        function drawPlayer(x, y, dir, frame) {
            ctx.save();
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x, y + 30, 15, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.translate(x, y);
            if (dir === 'left') ctx.scale(-1, 1);
            
            // Cape
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(-20, 5, 40, 6);
            const capeFlow = frame === 1 ? 25 : 30;
            ctx.fillRect(-18, 11, 36, capeFlow);
            
            // Body
            ctx.fillStyle = '#0066FF';
            ctx.fillRect(-15, 0, 30, 40);
            
            // Head
            ctx.fillStyle = '#FFD1AA';
            ctx.fillRect(-13, -25, 26, 25);
            
            // Hair
            ctx.fillStyle = '#2C1810';
            ctx.fillRect(-13, -30, 26, 8);
            
            // Mask
            ctx.fillStyle = '#000';
            ctx.fillRect(-15, -18, 30, 8);
            
            // Eyes
            ctx.fillStyle = '#FFF';
            ctx.fillRect(-10, -15, 6, 4);
            ctx.fillRect(4, -15, 6, 4);
            
            // Arms
            const armSwing = frame === 1 ? 4 : -4;
            ctx.fillStyle = '#0066FF';
            ctx.fillRect(-20, 5 + armSwing, 8, 25);
            ctx.fillRect(12, 5 - armSwing, 8, 25);
            
            // Legs
            const legSwing = frame === 1 ? 5 : -5;
            ctx.fillStyle = '#003399';
            ctx.fillRect(-12, 40 + legSwing, 10, 25);
            ctx.fillRect(2, 40 - legSwing, 10, 25);
            
            // Boots
            ctx.fillStyle = '#000';
            ctx.fillRect(-12, 63 + legSwing, 10, 4);
            ctx.fillRect(2, 63 - legSwing, 10, 4);
            
            ctx.restore();
        }
        
        gameLoop();
    </script>
</body>
</html>
